<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1C1917" />
    <link rel="icon" type="image/webp" href="/images/pjd_logo.webp" />

    <!-- Preload LCP hero image -->
    <link rel="preload" as="image" href="/images/paul_jeggels_shaping_5.webp" fetchpriority="high" />

    <!-- DNS Prefetch -->
    <link rel="dns-prefetch" href="https://dplbfhwqbmnzmrncxain.supabase.co" />

    <!-- Google Fonts (non-render-blocking) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400;500;600;700;800;900&family=Cabin:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400;500;600;700;800;900&family=Cabin:wght@400;500;600;700&display=swap"></noscript>

    <!-- Per-page title / description / canonical / Open Graph / Twitter are
         injected here at prerender time from each route's <Seo> component. -->

    <!-- JSON-LD: Organization + LocalBusiness (site-wide) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": ["Organization", "LocalBusiness"],
      "@id": "https://pauljeggelsdesigns.co.za/#organization",
      "name": "Paul Jeggels Designs",
      "url": "https://pauljeggelsdesigns.co.za",
      "logo": "https://pauljeggelsdesigns.co.za/images/pjd_logo.jpeg",
      "image": "https://pauljeggelsdesigns.co.za/images/paul_jeggels_shaping_5.jpg",
      "description": "Custom hand-shaped surfboards by Paul Jeggels in Jeffreys Bay, South Africa. Over 40 years of experience and 4,000+ boards shaped.",
      "telephone": "+27829609353",
      "email": "info@pauljeggelsdesigns.co.za",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "15 Dageraad Street",
        "addressLocality": "Jeffreys Bay",
        "addressRegion": "Eastern Cape",
        "postalCode": "6330",
        "addressCountry": "ZA"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": -33.9333,
        "longitude": 25.0333
      },
      "sameAs": [
        "https://www.instagram.com/pauljeggelsdesigns"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+27829609353",
        "contactType": "sales",
        "availableLanguage": ["English", "Afrikaans"]
      },
      "priceRange": "R500 - R15000+",
      "openingHoursSpecification": {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
        "opens": "08:00",
        "closes": "17:00"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entry-client.jsx"></script>
  </body>
</html>
